<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Clicável - Dignidade Sênior</title>
    <style>
        /* Estilos base para a página */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9; 
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: stretch;
        }

        /* Estilo da caixa azul (o perfil em si) */
        .sidebar-perfil {
            width: 100%;
            max-width: 350px; 
            height: 100vh;
            background-color: #007bff; /* Azul primário */
            color: white;
            padding: 25px 20px;
            border-radius: 0; 
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Estilo para a imagem/emoji de destaque */
        .profile-icon {
            font-size: 70px;
            margin-bottom: 10px;
            display: block;
        }

        /* Estilos dos textos principais */
        .title {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .mission {
            font-size: 0.95em;
            margin-bottom: 25px;
        }

        /* Título dos Contatos Rápidos (verde) */
        .contacts-title {
            color: #28a745; 
            font-size: 1.1em;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        /* Estilos para os blocos de contato (agora tags <a>) */
        .contact-link {
            /* Transforma o link em um bloco de botão */
            display: flex; 
            align-items: center;
            gap: 10px;

            /* Visual do Botão */
            background-color: white;
            color: #333;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            text-align: left;
            width: 90%; 
            font-size: 0.9em;
            line-height: 1.3;
            text-decoration: none; /* Remove o sublinhado padrão do link */
            transition: background-color 0.2s; /* Efeito de transição suave */
        }
        
        /* Efeito ao passar o mouse */
        .contact-link:hover {
            background-color: #e9ecef; /* Um cinza bem clarinho ao passar o mouse */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Estilos para os ícones */
        .contact-link .icon {
            font-size: 1.3em;
            color: #007bff; 
        }
        
        /* Estiliza o texto importante em negrito */
        .mission strong {
            color: white;
            font-weight: 700;
        }

    </style>
</head>
<body>

    <div class="sidebar-perfil">
        
        <div class="profile-icon">🤝</div>
        
        <div class="title">Dignidade Sênior</div>
        <div class="mission">
            Missão: Combate ao Etarismo e Bullying Contra Idosos.
        </div>
        
        <div class="contacts-title">Contatos Rápidos</div>
        
        <a href="tel:100" class="contact-link">
            <span class="icon">📞</span>
            <div>Denúncia: Disque 100</div>
        </a>

        <a href="mailto:contato@dignidadesenior.org" class="contact-link">
            <span class="icon">📧</span>
            <div>Email: CentralBullying@gmail.com</div>
        </a>
        
        <a href="#" class="contact-link">
            <span class="icon">📍</span>
            <div>Local: Mude suas informações</div>
        </a>

    </div>

</body>
</html>
